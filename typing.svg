<svg width="400" height="60" viewBox="0 0 400 60" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text {
      font: 24px monospace;
      fill: #00f1dc;
    }
    .cursor {
      font: 24px monospace;
      fill: #ff00ff;
      animation: blink 0.7s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <text x="10" y="35" class="text">CodeFlow</text>
  <text x="120" y="35" class="cursor">|</text>
</svg>
